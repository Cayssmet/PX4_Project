waypoint_manager:
  ros__parameters:
    # ==================================================================
    # 一、本地测试模式（当前默认配置）
    # ==================================================================
    # 当前尚未接入地面站，因此默认启动后使用下方本地航线。
    # 地面站联调时请改用 waypoint_manager_ground_station.yaml。
    require_ground_station_route: false

    # 只有同时满足下面两个条件，本地 YAML 航线才会自动激活：
    #   require_ground_station_route: false
    #   allow_local_route_for_test: true
    # 这样可以防止比赛时误把调试航线当成正式航线执行。
    allow_local_route_for_test: true

    # 最后一个航点完整完成后是否发布 /mission/land_request=true。
    land_on_mission_complete: true

    # ==================================================================
    # 二、本地调试/备用航线
    # ==================================================================
    # 所有数组长度必须完全相同；相同下标的值组成同一个航点。
    # 本地测试模式会在节点启动时自动执行这些航点。
    local_route_id: 1
    local_waypoint_ids: [1, 2, 3]

    # x、y：map 地图坐标系，单位 m。
    local_x: [0.0, -0.3, -0.3]
    local_y: [0.0, 0.0, -0.3]

    # yaw：单位 rad，从上方向下看逆时针为正；程序会归一化到 [-pi, pi]。
    local_yaw: [0.0, 0.0, 1.57079632679]

    # 飞控 z 轴 PID 使用的目标离地高度，单位 m。
    # 0.0 只是数值 0，不表示“屏蔽高度”或“降落”。
    local_target_height: [1.0, 1.0, 1.0]

    # 各航点到达后的期望停留时间，单位 s。
    # 若某项小于 minimum_hold_time，实际仍按 minimum_hold_time 执行。
    local_hold_time: [1.0, 1.0, 1.0]

    # ==================================================================
    # 三、到达确认、停留与反馈抗波动
    # ==================================================================
    # 平面/yaw 和高度条件必须连续为 true 达到 0.7 s，才进入停留状态。
    arrival_confirm_time: 0.7

    # 每个航点最少停留 1.0 s；实际值=max(本参数, 航点自身 hold_time)。
    minimum_hold_time: 0.8

    # 停留期间，反馈偶发 false 不超过 0.3 s 时视为噪声，不清空停留进度；
    # 持续超过该时间才退回跟踪状态，重新确认到达。
    reach_lost_grace_time: 0.3

    # 切换航点后先屏蔽旧“已到达”反馈，防止残留 true 导致瞬间跳过新航点。
    new_target_guard_time: 0.3

    # 超过以下时间没有新反馈，就不允许推进航点。
    pid_feedback_timeout_ms: 500
    flight_status_timeout_ms: 500

    # ==================================================================
    # 四、航线合法范围
    # ==================================================================
    map_frame: "map"
    max_waypoints: 100
    max_abs_x: 1000.0          # 要求 abs(x) <= 此值，单位 m
    max_abs_y: 1000.0          # 要求 abs(y) <= 此值，单位 m
    min_target_height: 0.0     # 单位 m
    max_target_height: 20.0    # 单位 m
    max_hold_time: 120.0       # 单个航点允许的最大 hold_time，单位 s

    # ==================================================================
    # 五、运行频率与日志
    # ==================================================================
    manager_rate_hz: 20.0
    # true 时每秒输出一次任务摘要；正式运行若日志过多可改为 false。
    print_status: true

    # 真机提示：以上范围和时间是联调用保守初值，必须结合赛题场地、
    # 激光高度反馈波动和飞行器实际响应重新验证。
