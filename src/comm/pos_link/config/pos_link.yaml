# pos_link 桥接节点参数
#
# ★ 节点名 pos_link_bridge 是代码里定死的（bridge_node.py 的 Node 构造参数），
#   这里改名了就加载不上，会静默用默认值——排查时最容易忽略的一处。
pos_link_bridge:
  ros__parameters:
    # 树莓派在热点里的固定地址 192.168.50.1，端口必须和固件 HOST_PORT 一致
    listen_port: 5000

    # ★ 坐标从哪来：订阅这个话题（geometry_msgs/PointStamped）。
    #   谁来发都行：定位节点、任务节点、或者手敲 ros2 topic pub 测试。
    input_topic: "/pos_link/target"

    # 下发周期（毫秒）。ESP32 侧不做重发，频率由这里说了算。
    send_period_ms: 1000

    # 坐标源断了怎么办：
    #   true  = 继续下发最后一次值（保持位置，推荐）
    #   false = 干脆不发（ESP32 那边会看到链路沉默）
    hold_last_on_stale: true

    # 超过这么多秒没新坐标就告警
    stale_warn_s: 5.0
